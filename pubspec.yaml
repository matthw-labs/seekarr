name: seekarr
description: A Flutter app for managing self-hosted Seerr, Radarr, Sonarr, and Lidarr services.
homepage: https://github.com/matthw-labs/seekarr
repository: https://github.com/matthw-labs/seekarr
issue_tracker: https://github.com/matthw-labs/seekarr/issues

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.8.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.2.0
  cached_network_image: ^3.4.1
  # Promoted from a transitive dependency of `cached_network_image` so
  # `lib/core/network/pinned_image_cache.dart` can build a per-origin
  # `CacheManager`/`HttpFileService` pinned to a trusted self-signed
  # certificate (ADR-6) — posters from an arr instance behind one would
  # otherwise stay broken even after the API transport is pinned, since
  # `cached_network_image` fetches over its own HTTP stack.
  flutter_cache_manager: ^3.4.1
  # Promoted for the same reason: `HttpFileService` takes a `package:http`
  # `Client`, and `IOClient` is what lets it wrap our pinned `dart:io`
  # `HttpClient`.
  http: ^1.6.0
  flutter_svg: ^2.2.3
  infinite_scroll_pagination: ^5.1.1
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.3
  file_picker: ^8.1.4
  socket_io_client: ^3.1.0
  # Referenced directly for the custom WebSocket connector that pins a trusted
  # self-signed certificate on the Dockge Socket.IO connection.
  web_socket: ^1.0.1
  # Carries one long-running release search across app suspension on iOS and
  # Android. Its `DataTask` is routed onto a real background `URLSession`, which
  # is what lets a multi-minute request survive being backgrounded — and needs no
  # `UIBackgroundModes`, so there is nothing to justify at App Store review. Two
  # of its defaults are actively wrong for this use and are overridden at startup
  # in `main.dart`: `requestTimeout` (60s "waiting for more data", and our server
  # sends nothing for minutes) and `doRescheduleKilledTasks` (would silently
  # re-run a killed search against the user's indexers).
  background_downloader: ^9.5.7
  # Tells the user a background search finished. Only `POST_NOTIFICATIONS` is
  # required, because `zonedSchedule` is never called — which is what keeps this
  # clear of the Play-restricted exact-alarm permissions.
  flutter_local_notifications: ^22.2.0
  # SHA-256 fingerprints for trust-on-first-use TLS certificate pinning.
  crypto: ^3.0.0
  # Grapheme-slot text rolling, used only where a *changing* value is the
  # information: live figures, state words, command labels. Pure Dart, no
  # platform channels, no transitive dependencies — see `lib/core/reel_motion.dart`
  # for the one place its timing is chosen.
  #
  # Pinned to an exact version on purpose. It is pre-1.0 with a single
  # maintainer, and it reaches into `TextPainter`, dry layout and baseline
  # metrics — the part of Flutter most likely to move under it. A caret here
  # would let a patch release change text layout across the app unreviewed.
  reel_text: 0.4.3

dependency_overrides:
  # path_provider_foundation 2.6.0 pulls in objective_c native assets,
  # which currently breaks iOS release install/signing on device.
  path_provider_foundation: 2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

  assets:
    # The product mark — the Cupola seen from above: six lit window panes on the
    # hexagon's edge midpoints, around the central circular window. Rendered from
    # `assets/brand/cupola_mark.svg`, which is the vector source of record.
    - assets/brand/seekarr_mark.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
