# Pre-seeded SABnzbd config for the E2E harness (plan §7.6). Gives a
# deterministic API key and whitelists loopback so the client can reach the
# instance via 127.0.0.1 without tripping SABnzbd's hostname verification.
[misc]
api_key = test-key
host_whitelist = 127.0.0.1, localhost, sabnzbd
inet_exposure = 4
