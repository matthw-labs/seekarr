<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Seekarr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. The dark-ground mark would disappear against a light browser
       chrome, so each scheme gets its own ground. The last matching link wins
       in browsers that ignore `media`, so the dark one stays the fallback. -->
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)"/>
  <link rel="icon" type="image/png" href="favicon.png" media="(prefers-color-scheme: dark)"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Seekarr</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
