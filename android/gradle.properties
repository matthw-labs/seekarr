org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Duplicate of the line above, under the unprefixed name, purely for
# background_downloader. On AGP 9 its build.gradle stops applying kotlin-android
# and relies on AGP's built-in Kotlin for the `kotlin { }` block it then uses —
# but its opt-out check reads `builtInKotlin`, while Flutter's migrator writes
# `android.builtInKotlin`. The mismatch means the guard never fires and the
# subproject fails to evaluate with "Could not find method kotlin()". Nothing
# else in the dependency tree reads this name.
builtInKotlin=false
